<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1C" />
      <stop offset="100%" stop-color="#111C2E" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Network Interconnection Grid Lines -->
  <path d="M12 32 L32 12 M32 12 L52 32 M32 12 L32 52 M12 32 L52 32" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35" />
  <circle cx="32" cy="12" r="3" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="12" cy="32" r="2.5" fill="#2563EB" />
  <circle cx="52" cy="32" r="2.5" fill="#2563EB" />
  <circle cx="32" cy="52" r="3" fill="#06B6D4" filter="url(#glow)" />

  <!-- Central Network Monogram "EA" -->
  <text x="32" y="39" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC" letter-spacing="-0.5">
    EA
  </text>

  <!-- Signal Wave Pulse (Cyan Accent) -->
  <path d="M26 47 Q32 44 38 47" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow)" />
</svg>
